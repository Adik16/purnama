<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Demo aplikasi kasir sederhana untuk mengelola produk dan simulasi transaksi."
    />
    <title>Kasir Purnama | Demo</title>
    <style>
      :root {
        color-scheme: light;
        --green: #14804a;
        --green-dark: #0b5b35;
        --green-light: #e9f7ef;
        --ink: #17231c;
        --muted: #748078;
        --line: #e5ebe7;
        --surface: #ffffff;
        --page: #f5f8f6;
        --red: #bd4d4d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--page);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .topbar-inner {
        width: min(1440px, 94%);
        min-height: 72px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 800;
        font-size: 1.1rem;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--green);
        color: white;
        font-size: 1.2rem;
      }

      .topbar-note {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .demo-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 11px;
        border-radius: 999px;
        background: #fff4dc;
        color: #825a10;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .demo-label::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e6a51a;
      }

      main {
        width: min(1440px, 94%);
        margin: auto;
        padding: 32px 0 48px;
      }

      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .page-heading h1 {
        margin-bottom: 5px;
        font-size: clamp(1.7rem, 3vw, 2.2rem);
        letter-spacing: -0.04em;
      }

      .page-heading p {
        color: var(--muted);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 370px;
        align-items: start;
        gap: 22px;
      }

      .catalog,
      .cart-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 8px 28px rgba(30, 55, 39, 0.04);
      }

      .catalog {
        padding: 22px;
      }

      .catalog-tools {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .search-wrap {
        position: relative;
        flex: 1;
      }

      .search-wrap span {
        position: absolute;
        top: 50%;
        left: 13px;
        transform: translateY(-50%);
      }

      .search-input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px 10px 40px;
        border: 1px solid var(--line);
        border-radius: 11px;
        outline: none;
      }

      .search-input:focus,
      .payment-input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(20, 128, 74, 0.12);
      }

      .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        margin-bottom: 18px;
      }

      .category-btn {
        flex: 0 0 auto;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        color: #526057;
      }

      .category-btn.active {
        border-color: var(--green);
        background: var(--green);
        color: white;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 14px;
      }

      .product-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }

      .product-icon {
        display: grid;
        place-items: center;
        height: 90px;
        margin-bottom: 13px;
        border-radius: 11px;
        background: var(--green-light);
        font-size: 2.5rem;
      }

      .product-category {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .product-card h3 {
        margin: 2px 0 10px;
        font-size: 1rem;
      }

      .product-card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .product-price {
        color: var(--green-dark);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .add-btn {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 10px;
        background: var(--green-light);
        color: var(--green-dark);
        font-size: 1.25rem;
        font-weight: 700;
      }

      .add-btn:hover {
        background: var(--green);
        color: white;
      }

      .empty-products,
      .empty-cart {
        padding: 30px 12px;
        color: var(--muted);
        text-align: center;
      }

      .cart-panel {
        position: sticky;
        top: 18px;
        overflow: hidden;
      }

      .cart-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }

      .cart-heading h2 {
        font-size: 1.1rem;
      }

      .item-count {
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--green-light);
        color: var(--green-dark);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .cart-items {
        max-height: 300px;
        overflow-y: auto;
        padding: 4px 20px;
      }

      .cart-item {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }

      .cart-item-icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--green-light);
        font-size: 1.3rem;
      }

      .cart-item-name {
        font-size: 0.88rem;
        font-weight: 700;
      }

      .cart-item-price {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .quantity-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .quantity-control button {
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
      }

      .quantity-control button:hover {
        border-color: var(--green);
        color: var(--green);
      }

      .quantity-control span {
        min-width: 12px;
        text-align: center;
        font-size: 0.85rem;
      }

      .cart-summary {
        padding: 18px 20px 20px;
        background: #fbfcfb;
      }

      .summary-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .summary-total {
        margin-top: 13px;
        padding-top: 13px;
        border-top: 1px dashed #d8e1db;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 800;
      }

      .payment-label {
        display: block;
        margin: 18px 0 7px;
        color: #46534a;
        font-size: 0.86rem;
        font-weight: 700;
      }

      .payment-input {
        width: 100%;
        min-height: 43px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: white;
      }

      .change-line {
        margin-top: 9px;
        color: var(--green-dark);
        font-weight: 700;
      }

      .change-line.insufficient {
        color: var(--red);
      }

      .checkout-btn {
        width: 100%;
        min-height: 46px;
        margin-top: 15px;
        border: 0;
        border-radius: 11px;
        background: var(--green);
        color: white;
        font-weight: 700;
      }

      .checkout-btn:hover:not(:disabled) {
        background: var(--green-dark);
      }

      .checkout-btn:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .back-link {
        display: inline-block;
        margin-top: 22px;
        color: var(--green-dark);
        font-weight: 700;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .receipt-overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(15, 28, 20, 0.55);
      }

      .receipt-overlay[hidden] {
        display: none;
      }

      .receipt {
        width: min(420px, 100%);
        padding: 26px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2);
      }

      .receipt h2 {
        margin-bottom: 6px;
      }

      .receipt p {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .receipt-items {
        margin: 18px 0;
        padding: 14px 0;
        border-top: 1px dashed #ccd8cf;
        border-bottom: 1px dashed #ccd8cf;
      }

      .receipt-item {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin: 5px 0;
        font-size: 0.88rem;
      }

      .receipt-close {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        color: white;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr) 330px;
          gap: 14px;
        }

        .catalog {
          padding: 16px;
        }
      }

      @media (max-width: 720px) {
        .topbar-inner,
        main {
          width: min(100% - 28px, 560px);
        }

        .topbar-note {
          display: none;
        }

        main {
          padding-top: 24px;
        }

        .page-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .cart-panel {
          position: static;
        }
      }

      @media (max-width: 420px) {
        .catalog-tools {
          flex-direction: column;
        }

        .product-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .product-card {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">⌂</span>
          <span>Kasir Purnama</span>
        </a>
        <p class="topbar-note">Kelola pesanan dengan mudah</p>
        <span class="demo-label">Mode Demo</span>
      </div>
    </header>

    <main>
      <div class="page-heading">
        <div>
          <h1>Kasir Toko</h1>
          <p>Pilih produk untuk memulai transaksi baru.</p>
        </div>
      </div>

      <div class="workspace">
        <section class="catalog" aria-label="Daftar produk">
          <div class="catalog-tools">
            <label class="search-wrap">
              <span aria-hidden="true">⌕</span>
              <input
                class="search-input"
                id="searchInput"
                type="search"
                placeholder="Cari nama produk..."
                aria-label="Cari nama produk"
              />
            </label>
          </div>
          <div class="categories" id="categories" aria-label="Kategori produk"></div>
          <div class="product-grid" id="productGrid"></div>
        </section>

        <aside class="cart-panel" aria-label="Keranjang transaksi">
          <div class="cart-heading">
            <h2>Keranjang</h2>
            <span class="item-count" id="itemCount">0 item</span>
          </div>
          <div class="cart-items" id="cartItems" aria-live="polite"></div>
          <div class="cart-summary">
            <div class="summary-line">
              <span>Subtotal</span>
              <strong id="subtotal">Rp0</strong>
            </div>
            <div class="summary-line summary-total">
              <span>Total</span>
              <strong id="total">Rp0</strong>
            </div>
            <label class="payment-label" for="paymentInput">Jumlah bayar</label>
            <input
              class="payment-input"
              id="paymentInput"
              type="number"
              min="0"
              step="500"
              placeholder="Masukkan nominal"
              inputmode="numeric"
            />
            <div class="summary-line change-line" id="changeLine" aria-live="polite">
              <span>Kembalian</span>
              <strong id="change">Rp0</strong>
            </div>
            <button class="checkout-btn" id="checkoutBtn" type="button" disabled>
              Selesaikan Transaksi (Demo)
            </button>
          </div>
        </aside>
      </div>

      <a class="back-link" href="index.html">← Kembali ke portofolio</a>
    </main>

    <div
      class="receipt-overlay"
      id="receiptOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="receiptTitle"
      hidden
    >
      <div class="receipt">
        <h2 id="receiptTitle">Transaksi Berhasil</h2>
        <p>Ini adalah bukti transaksi simulasi.</p>
        <div class="receipt-items" id="receiptItems"></div>
        <div class="summary-line">
          <span>Total</span>
          <strong id="receiptTotal"></strong>
        </div>
        <div class="summary-line">
          <span>Bayar</span>
          <strong id="receiptPayment"></strong>
        </div>
        <div class="summary-line change-line">
          <span>Kembalian</span>
          <strong id="receiptChange"></strong>
        </div>
        <button class="receipt-close" id="receiptClose" type="button">
          Transaksi Baru
        </button>
      </div>
    </div>

    <script>
      const products = [
        { id: 1, name: "Kopi Susu", category: "Minuman", price: 18000, icon: "☕" },
        { id: 2, name: "Teh Lemon", category: "Minuman", price: 12000, icon: "🍋" },
        { id: 3, name: "Air Mineral", category: "Minuman", price: 6000, icon: "💧" },
        { id: 4, name: "Roti Cokelat", category: "Makanan", price: 10000, icon: "🥐" },
        { id: 5, name: "Kentang Goreng", category: "Makanan", price: 15000, icon: "🍟" },
        { id: 6, name: "Nasi Ayam", category: "Makanan", price: 25000, icon: "🍗" },
        { id: 7, name: "Keripik", category: "Camilan", price: 8000, icon: "🥔" },
        { id: 8, name: "Donat", category: "Camilan", price: 9000, icon: "🍩" },
      ];

      const categories = ["Semua", ...new Set(products.map((product) => product.category))];
      const cart = new Map();
      let activeCategory = "Semua";

      const productGrid = document.getElementById("productGrid");
      const cartItems = document.getElementById("cartItems");
      const searchInput = document.getElementById("searchInput");
      const paymentInput = document.getElementById("paymentInput");
      const checkoutBtn = document.getElementById("checkoutBtn");
      const receiptOverlay = document.getElementById("receiptOverlay");

      const formatRupiah = (amount) =>
        new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(amount);

      function renderCategories() {
        document.getElementById("categories").innerHTML = categories
          .map(
            (category) => `
              <button
                class="category-btn${category === activeCategory ? " active" : ""}"
                type="button"
                data-category="${category}"
                aria-pressed="${category === activeCategory}"
              >${category}</button>
            `
          )
          .join("");
      }

      function renderProducts() {
        const query = searchInput.value.trim().toLocaleLowerCase("id-ID");
        const filteredProducts = products.filter(
          (product) =>
            (activeCategory === "Semua" || product.category === activeCategory) &&
            product.name.toLocaleLowerCase("id-ID").includes(query)
        );

        productGrid.innerHTML = filteredProducts.length
          ? filteredProducts
              .map(
                (product) => `
                  <article class="product-card">
                    <div class="product-icon" aria-hidden="true">${product.icon}</div>
                    <span class="product-category">${product.category}</span>
                    <h3>${product.name}</h3>
                    <div class="product-card-bottom">
                      <span class="product-price">${formatRupiah(product.price)}</span>
                      <button
                        class="add-btn"
                        type="button"
                        data-add="${product.id}"
                        aria-label="Tambah ${product.name} ke keranjang"
                      >+</button>
                    </div>
                  </article>
                `
              )
              .join("")
          : '<p class="empty-products">Produk tidak ditemukan.</p>';
      }

      function getTotal() {
        return [...cart.values()].reduce(
          (total, item) => total + item.product.price * item.quantity,
          0
        );
      }

      function updateCart() {
        const items = [...cart.values()];
        const count = items.reduce((total, item) => total + item.quantity, 0);
        const total = getTotal();
        const payment = Math.max(0, Number(paymentInput.value) || 0);
        const isInsufficient = payment < total;

        document.getElementById("itemCount").textContent = `${count} item`;
        document.getElementById("subtotal").textContent = formatRupiah(total);
        document.getElementById("total").textContent = formatRupiah(total);
        document.getElementById("change").textContent = formatRupiah(
          Math.max(0, payment - total)
        );
        document.getElementById("changeLine").classList.toggle(
          "insufficient",
          count > 0 && isInsufficient
        );
        checkoutBtn.disabled = count === 0 || isInsufficient;

        cartItems.innerHTML = items.length
          ? items
              .map(
                ({ product, quantity }) => `
                  <div class="cart-item">
                    <span class="cart-item-icon" aria-hidden="true">${product.icon}</span>
                    <div>
                      <div class="cart-item-name">${product.name}</div>
                      <div class="cart-item-price">${formatRupiah(product.price * quantity)}</div>
                    </div>
                    <div class="quantity-control" aria-label="Jumlah ${product.name}">
                      <button type="button" data-quantity="${product.id}" data-change="-1" aria-label="Kurangi ${product.name}">−</button>
                      <span>${quantity}</span>
                      <button type="button" data-quantity="${product.id}" data-change="1" aria-label="Tambah ${product.name}">+</button>
                    </div>
                  </div>
                `
              )
              .join("")
          : '<p class="empty-cart">Keranjang masih kosong.<br />Tambahkan produk untuk memulai.</p>';
      }

      document.getElementById("categories").addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        renderCategories();
        renderProducts();
      });

      productGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-add]");
        if (!button) return;
        const product = products.find((item) => item.id === Number(button.dataset.add));
        const current = cart.get(product.id);
        cart.set(product.id, { product, quantity: current ? current.quantity + 1 : 1 });
        updateCart();
      });

      cartItems.addEventListener("click", (event) => {
        const button = event.target.closest("[data-quantity]");
        if (!button) return;
        const id = Number(button.dataset.quantity);
        const current = cart.get(id);
        const quantity = current.quantity + Number(button.dataset.change);
        if (quantity <= 0) {
          cart.delete(id);
        } else {
          cart.set(id, { ...current, quantity });
        }
        updateCart();
      });

      searchInput.addEventListener("input", renderProducts);
      paymentInput.addEventListener("input", updateCart);

      checkoutBtn.addEventListener("click", () => {
        const items = [...cart.values()];
        const total = getTotal();
        const payment = Number(paymentInput.value);
        const change = payment - total;
        if (items.length === 0 || payment < total) return;

        document.getElementById("receiptItems").innerHTML = items
          .map(
            ({ product, quantity }) => `
              <div class="receipt-item">
                <span>${product.name} × ${quantity}</span>
                <strong>${formatRupiah(product.price * quantity)}</strong>
              </div>
            `
          )
          .join("");
        document.getElementById("receiptTotal").textContent = formatRupiah(total);
        document.getElementById("receiptPayment").textContent = formatRupiah(payment);
        document.getElementById("receiptChange").textContent = formatRupiah(change);
        receiptOverlay.hidden = false;
        cart.clear();
        paymentInput.value = "";
        updateCart();
        document.getElementById("receiptClose").focus();
      });

      document.getElementById("receiptClose").addEventListener("click", () => {
        receiptOverlay.hidden = true;
        searchInput.focus();
      });

      renderCategories();
      renderProducts();
      updateCart();
    </script>
  </body>
</html>
